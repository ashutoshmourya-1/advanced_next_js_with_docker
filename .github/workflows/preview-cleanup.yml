name: Preview Cleanup

on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Remove PR preview
        run: |
          chmod +x ./scripts/stop-preview.sh
          ./scripts/stop-preview.sh "${{ github.event.pull_request.number }}"