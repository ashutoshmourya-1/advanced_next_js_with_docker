name: Preview Cleanup

on:
  pull_request:
    types:
      - closed

jobs:
  cleanup:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate .env files
        run: |
          cat > advanced_next_js/.env <<EOF
          NEXT_PUBLIC_BACKEND_API_URL=${{ secrets.NEXT_PUBLIC_BACKEND_API_URL }}
          NEXT_PUBLIC_PORT=${{ secrets.NEXT_PUBLIC_PORT }}
          EOF

          cat > node_js/.env <<EOF
          PORT=${{ secrets.PORT }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
          EOF

          cat > .env <<EOF
          NEXT_JS_PORT=${{ secrets.NEXT_JS_PORT }}
          NODE_JS_PORT=${{ secrets.NODE_JS_PORT }}
          CADDY_PORT=${{ secrets.CADDY_PORT }}
          CADDY_PORT_2=${{ secrets.CADDY_PORT_2 }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          EOF

      - name: Remove PR preview
        run: |
          chmod +x ./scripts/stop-preview.sh
          ./scripts/stop-preview.sh "${{ github.event.pull_request.number }}"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"🚨 *Pipeline Failed*\n*Repo:* ${{ github.repository }}\n*Workflow:* ${{ github.workflow }}\n*Branch/PR:* #${{ github.event.pull_request.number }}\n*Commit:* ${{ github.sha }}\n*Triggered by:* ${{ github.actor }}\n*Logs:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"