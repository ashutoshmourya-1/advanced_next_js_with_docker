services:
  next_js:
    build: 
      context: ./advanced_next_js
    container_name: next_js
    env_file:
      - ./advanced_next_js/.env
    ports:
      - "${NEXT_PUBLIC_PORT}:${NEXT_PUBLIC_PORT}"
    networks:
      - next_node
    depends_on:
      node_js:
        condition: service_healthy

  node_js:
    build:
      context: ./node_js
    container_name: node_js
    env_file:
      - ./node_js/.env
    ports:
      - "${PORT}:${PORT}"
    restart: unless-stopped
    networks:
      - next_node
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "health_check.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ./node_js/.env
    networks:
      - next_node
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
volumes:
  postgres_data:

networks:
  next_node: